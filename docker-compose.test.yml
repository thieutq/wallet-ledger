services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wallet_ledger_test
      POSTGRES_USER: wallet_ledger_test
      POSTGRES_PASSWORD: wallet_ledger_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_ledger_test"]
      interval: 5s
      timeout: 5s
      retries: 10
