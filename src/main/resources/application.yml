server:
  port: 8080

spring:
  application:
    name: wallet-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_ledger}
    username: ${DB_USERNAME:wallet_ledger}
    password: ${DB_PASSWORD:wallet_ledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
