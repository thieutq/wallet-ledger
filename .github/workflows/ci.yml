name: CI

on:
  push:
    paths:
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - "src/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Run integration tests
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=50
        run: ./mvnw -B failsafe:integration-test failsafe:verify

      - name: Dump Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker inspect $(docker ps -aq --filter ancestor=postgres:15-alpine) || true
          docker logs $(docker ps -aq --filter ancestor=postgres:15-alpine) || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
